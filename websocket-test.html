<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Portfolio Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .controls { margin: 10px 0; }
        .controls input, .controls button { margin: 5px; padding: 8px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .status.connected { background-color: #d4edda; color: #155724; }
        .status.disconnected { background-color: #f8d7da; color: #721c24; }
        .status.connecting { background-color: #fff3cd; color: #856404; }
        .messages { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; background-color: #f9f9f9; }
        .message { margin: 5px 0; padding: 5px; background-color: white; border-radius: 3px; }
        .message.sent { background-color: #e3f2fd; }
        .message.received { background-color: #f3e5f5; }
        .message.error { background-color: #ffebee; color: #c62828; }
        .portfolio-data { background-color: #f5f5f5; padding: 10px; border-radius: 5px; margin: 10px 0; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Portfolio Test Interface</h1>
        
        <div class="section">
            <h2>Kết nối WebSocket</h2>
            <div class="controls">
                <input type="text" id="serverUrl" placeholder="Server URL" value="http://localhost:8080/ws">
                <textarea id="jwtToken" placeholder="JWT Token từ login API (không cần 'Bearer ' prefix)" rows="3" style="width: 500px;"></textarea>
                <button onclick="testLogin()">Test Login API</button>
                <button onclick="testServer()">Test Server</button>
                <button onclick="connect()">Connect (JWT Required)</button>
                <button onclick="connectWithJWT()">Connect (JWT Full)</button>
                <button onclick="connectNative()">Connect Native (JWT)</button>
                <button onclick="testBasicStomp()">Test Basic STOMP (JWT)</button>
                <button onclick="disconnect()">Ngắt kết nối</button>
            </div>
            <div id="connectionStatus" class="status disconnected">Chưa kết nối</div>
        </div>

        <div class="section">
            <h2>Login Test</h2>
            <div class="controls">
                <input type="text" id="loginUrl" placeholder="Login API URL" value="http://localhost:8080/api/auth/login">
                <input type="username" id="username" placeholder="Username" value="truonggialinh2359@gmail.com">
                <input type="password" id="password" placeholder="Password">
                <button onclick="login()">Login & Get JWT</button>
                <button onclick="debugUser()">Debug User</button>
                <button onclick="testPassword()">Test Password</button>
                <button onclick="refreshJwtToken()">Refresh JWT Token</button>
            </div>
            <div class="controls">
                <label>Try default password: <input type="text" id="defaultPassword" placeholder="Default password" value="password123"></label>
                <button onclick="tryDefaultPassword()">Try Default</button>
            </div>
        </div>

        <div class="section">
            <h2>Portfolio Operations</h2>
            <div class="controls">
                <input type="text" id="userId" placeholder="User ID" value="user123">
                <button onclick="subscribePortfolio()" id="subscribeBtn" disabled>Subscribe Portfolio</button>
                <button onclick="getPortfolioList()" id="listBtn" disabled>Get Portfolio List</button>
                <button onclick="refreshPortfolio()" id="refreshBtn" disabled>Refresh Portfolio</button>
                <button onclick="unsubscribePortfolio()" id="unsubscribeBtn" disabled>Unsubscribe</button>
            </div>
            
            <div class="controls">
                <label>Include Balances: <input type="checkbox" id="includeBalances" checked></label>
                <label>Page: <input type="number" id="page" value="0" min="0"></label>
                <label>Size: <input type="number" id="size" value="10" min="1" max="100"></label>

            </div>

        <div class="section">
            <h2>Messages</h2>
            <button onclick="clearMessages()">Clear Messages</button>
            <div id="messages" class="messages"></div>
        </div>

        <div class="section">
            <h2>Portfolio Data</h2>
            <div id="portfolioData" class="portfolio-data">
                <p>Portfolio data sẽ hiển thị ở đây khi có updates...</p>
            </div>
        </div>
    </div>

    <script>
        let stompClient = null;
        let connected = false;
        let currentUserId = null;
        let heartbeatInterval = null;

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const userId = document.getElementById('userId').value || 'user123';
            const jwtToken = document.getElementById('jwtToken').value.trim();
            
            if (!jwtToken) {
                addMessage('❌ JWT token is required for connection. Please login first or enter a token.', 'error');
                return;
            }
            
            setConnectionStatus('connecting', 'Đang kết nối...');
            addMessage('Đang kết nối đến: ' + serverUrl, 'sent');
            addMessage('Using JWT token for authentication', 'sent');

            // Add JWT token to URL as query parameter
            const socketUrl = serverUrl + '?token=' + encodeURIComponent(jwtToken);
            const socket = new SockJS(socketUrl);
            
            // Add socket event handlers
            socket.onopen = function() {
                addMessage('✅ SockJS connection opened', 'received');
                // Add a small delay to ensure connection is ready
                setTimeout(() => {
                    addMessage('SockJS connection ready for STOMP', 'received');
                }, 100);
            };
            
            socket.onclose = function(event) {
                addMessage('❌ SockJS connection closed: ' + event.code + ' - ' + event.reason, 'error');
                connected = false;
                stopHeartbeat();
                setConnectionStatus('disconnected', 'SockJS connection closed');
            };
            
            socket.onerror = function(error) {
                addMessage('❌ SockJS error: ' + JSON.stringify(error), 'error');
            };
            
            stompClient = Stomp.over(socket);
            
            // Enable debug logging to see what's happening
            stompClient.debug = function(str) {
                console.log('STOMP DEBUG: ' + str);
                addMessage('STOMP: ' + str, 'received');
            };
            
            // Add error handler for connection issues
            stompClient.onStompError = function (frame) {
                console.error('STOMP Error Frame:', frame);
                addMessage('❌ STOMP Error: ' + frame.headers['message'], 'error');
                addMessage('Error Details: ' + frame.body, 'error');
                setConnectionStatus('disconnected', 'STOMP Error: ' + frame.headers['message']);
            };
            
            // Add receipt handler
            stompClient.onReceipt = function (frame) {
                console.log('STOMP Receipt:', frame);
                addMessage('✅ STOMP Receipt: ' + frame.headers['receipt-id'], 'received');
            };
            
            // Headers with JWT token
            const headers = {
                'Authorization': 'Bearer ' + jwtToken,
                'token': jwtToken,
                'accept-version': '1.0,1.1,1.2',
                'heart-beat': '0,0'
            };

            // Wait for SockJS to be fully ready before starting STOMP
            setTimeout(() => {
                // Add connection timeout
                const connectTimeout = setTimeout(() => {
                    if (!connected) {
                        addMessage('❌ Connection timeout - taking too long to connect', 'error');
                        setConnectionStatus('disconnected', 'Connection timeout');
                        if (stompClient) {
                            stompClient.disconnect();
                        }
                    }
                }, 30000); // 30 second timeout

                addMessage('🔄 Starting STOMP connection...', 'sent');
                try {
                    stompClient.connect(headers, (frame) => {
                        clearTimeout(connectTimeout);
                        addMessage('✅ STOMP connected successfully!', 'received');
                        onConnected(frame);
                    }, (error) => {
                        clearTimeout(connectTimeout);
                        addMessage('❌ STOMP connection failed: ' + error, 'error');
                        onError(error);
                    });
                } catch (error) {
                    clearTimeout(connectTimeout);
                    addMessage('❌ Error during STOMP connect: ' + error.message, 'error');
                    console.error('STOMP connect error:', error);
                    onError(error);
                }
            }, 1000); // 1 second delay to ensure SockJS is fully ready
        }

            // Add JWT token to URL as query parameter

                // Add a small delay to ensure connection is ready

            socket.onclose = function(event) {

            socket.onerror = function(error) {

            stompClient = Stomp.over(socket);
            
            // Enable debug logging to see what's happening

            // Add error handler for connection issues
            stompClient.onStompError = function (frame) {
                console.error('STOMP Error Frame:', frame);
                addMessage('❌ STOMP Error: ' + frame.headers['message'], 'error');
                addMessage('Error Details: ' + frame.body, 'error');
                setConnectionStatus('disconnected', 'STOMP Error: ' + frame.headers['message']);
            };
            
            // Add receipt handler
            stompClient.onReceipt = function (frame) {
                console.log('STOMP Receipt:', frame);
                addMessage('✅ STOMP Receipt: ' + frame.headers['receipt-id'], 'received');
            };
            
            // Headers với JWT token (both methods)
            const headers = {
                'Authorization': 'Bearer ' + jwtToken,
                'token': jwtToken,

                'heart-beat': '0,0'

            // Add connection timeout

                    clearTimeout(connectTimeout);
                    addMessage('❌ Error during STOMP connect: ' + error.message, 'error');
                    console.error('STOMP connect error:', error);

        function connectNative() {
            const serverUrl = document.getElementById('serverUrl').value;
            const userId = document.getElementById('userId').value || 'user123';
            const jwtToken = document.getElementById('jwtToken').value.trim();
            
            if (!jwtToken) {
                addMessage('❌ JWT token is required for native WebSocket connection. Please login first.', 'error');
                return;
            }
            
            // Convert HTTP URL to WebSocket URL
            let wsUrl = serverUrl.replace('http://', 'ws://').replace('https://', 'wss://');
            if (wsUrl.includes('/ws')) {
                wsUrl = wsUrl.replace('/ws', '/ws-native');
            } else {
                wsUrl = wsUrl + '/ws-native';
            }
            
            // Add JWT token to URL
            wsUrl += '?token=' + encodeURIComponent(jwtToken);
            
            setConnectionStatus('connecting', 'Đang kết nối...');
            addMessage('Đang kết nối đến native WebSocket: ' + wsUrl, 'sent');
            addMessage('Using JWT token for native WebSocket authentication', 'sent');

            // Create native WebSocket connection
            const socket = new WebSocket(wsUrl);
            
            socket.onopen = function() {
                addMessage('✅ Native WebSocket connection opened', 'received');
            };
            
            socket.onclose = function(event) {
                addMessage('❌ Native WebSocket connection closed: ' + event.code + ' - ' + event.reason, 'error');
                connected = false;
                setConnectionStatus('disconnected', 'Native WebSocket connection closed');
            };
            
            socket.onerror = function(error) {
                addMessage('❌ Native WebSocket error: ' + JSON.stringify(error), 'error');
                connected = false;
                setConnectionStatus('disconnected', 'Native WebSocket error');
            };
            
            socket.onmessage = function(event) {
                addMessage('Native WebSocket message: ' + event.data, 'received');
            };
            
            stompClient = Stomp.over(socket);
            
            // Enable debug logging to see what's happening
            stompClient.debug = function(str) {
                console.log('STOMP DEBUG (Native): ' + str);
                addMessage('STOMP (Native): ' + str, 'received');
            };
            
            // Add error handler for connection issues
            stompClient.onStompError = function (frame) {
                console.error('STOMP Error Frame:', frame);
                addMessage('❌ STOMP Error: ' + frame.headers['message'], 'error');
                addMessage('Error Details: ' + frame.body, 'error');
                setConnectionStatus('disconnected', 'STOMP Error: ' + frame.headers['message']);
            };
            
            // Headers with JWT token
            const headers = {
                'Authorization': 'Bearer ' + jwtToken,
                'token': jwtToken,
                'accept-version': '1.0,1.1,1.2',
                'heart-beat': '0,0'
            };

            // Add connection timeout
            const connectTimeout = setTimeout(() => {
                if (!connected) {
                    addMessage('❌ Connection timeout - taking too long to connect', 'error');
                    setConnectionStatus('disconnected', 'Connection timeout');
                    if (stompClient) {
                        stompClient.disconnect();
                    }
                    if (socket) {
                        socket.close();
                    }
                }
            }, 30000); // 30 second timeout

            try {
                stompClient.connect(headers, (frame) => {
                    clearTimeout(connectTimeout);
                    onConnected(frame);
                }, (error) => {
                    clearTimeout(connectTimeout);
                    onError(error);
                });
            } catch (error) {
                clearTimeout(connectTimeout);
                addMessage('❌ Error during STOMP connect: ' + error.message, 'error');
                console.error('STOMP connect error:', error);
                onError(error);
            }
        }

        function testBasicStomp() {
            const serverUrl = document.getElementById('serverUrl').value;
            const userId = document.getElementById('userId').value || 'user123';
            const jwtToken = document.getElementById('jwtToken').value.trim();
            
            if (!jwtToken) {
                addMessage('❌ JWT token is required for STOMP connection. Please login first.', 'error');
                return;
            }
            
            addMessage('🧪 Testing basic STOMP connection...', 'sent');
            setConnectionStatus('connecting', 'Testing STOMP...');
            
            // Simple SockJS connection with JWT token
            const socketUrl = serverUrl + '?token=' + encodeURIComponent(jwtToken);
            const socket = new SockJS(socketUrl);
            
            socket.onopen = function() {
                addMessage('✅ SockJS opened', 'received');
                
                // Create STOMP client
                const stomp = Stomp.over(socket);
                
                // Very verbose debug
                stomp.debug = function(str) {
                    addMessage('STOMP: ' + str, 'received');
                    console.log('STOMP: ' + str);
                };
                
                // Simple headers with JWT token
                const headers = {
                    'Authorization': 'Bearer ' + jwtToken,
                    'token': jwtToken
                };
                
                addMessage('🔄 Sending STOMP CONNECT...', 'sent');
                
                // Connect with minimal setup
                stomp.connect(headers, 
                    function(frame) {
                        addMessage('✅ STOMP CONNECT SUCCESS!', 'received');
                        addMessage('Frame: ' + JSON.stringify(frame), 'received');
                        connected = true;
                        stompClient = stomp;
                        setConnectionStatus('connected', 'STOMP Connected');
                    },
                    function(error) {
                        addMessage('❌ STOMP CONNECT FAILED: ' + error, 'error');
                        setConnectionStatus('disconnected', 'STOMP Connect Failed');
                    }
                );
            };
            
            socket.onclose = function(event) {
                addMessage('❌ SockJS closed: ' + event.code + ' - ' + event.reason, 'error');
                setConnectionStatus('disconnected', 'SockJS closed');
            };
            
            socket.onerror = function(error) {
                addMessage('❌ SockJS error: ' + error, 'error');
                setConnectionStatus('disconnected', 'SockJS error');
            };
        }

        async function login() {
            const loginUrl = document.getElementById('loginUrl').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                addMessage('Vui lòng nhập username và password', 'error');
                return;
            }

            try {
                addMessage('Đang login...', 'sent');
                
                const response = await fetch(loginUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    addMessage('Login thành công!', 'received');
                    
                    if (data.token || data.accessToken) {
                        const token = data.token || data.accessToken;
                        document.getElementById('jwtToken').value = token;
                        addMessage('JWT token đã được lưu tự động', 'received');
                        
                        // Auto-fill user ID if available
                        if (data.userId) {
                            document.getElementById('userId').value = data.userId;
                            addMessage('User ID: ' + data.userId, 'received');
                        }
                    } else {
                        addMessage('Không tìm thấy token trong response: ' + JSON.stringify(data), 'error');
                    }
                } else {
                    const errorData = await response.text();
                    addMessage('Login thất bại: ' + response.status + ' - ' + errorData, 'error');
                }
            } catch (error) {
                addMessage('Lỗi khi login: ' + error.message, 'error');
            }
        }

        function testLogin() {
            const loginUrl = document.getElementById('loginUrl').value;
            addMessage('Testing login endpoint: ' + loginUrl, 'sent');
            
            fetch(loginUrl, {
                method: 'OPTIONS'
            })
            .then(response => {
                addMessage('Login endpoint accessible - Status: ' + response.status, 'received');
            })
            .catch(error => {
                addMessage('Không thể kết nối đến login endpoint: ' + error.message, 'error');
            });
        }

        function testServer() {
            addMessage('Testing server WebSocket status...', 'sent');
            
            fetch('http://localhost:8080/api/websocket/status')
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Status: ' + response.status);
                }
            })
            .then(data => {
                addMessage('✅ Server status: ' + data.status, 'received');
                addMessage('Server message: ' + data.message, 'received');
                addMessage('Available endpoints: ' + JSON.stringify(data.endpoints), 'received');
            })
            .catch(error => {
                addMessage('❌ Server test failed: ' + error.message, 'error');
            });
        }

                addMessage('  Found: ' + data.found, 'received');
                if (data.found) {
                    addMessage('  User ID: ' + data.userId, 'received');
                    addMessage('  Username: ' + data.username, 'received');
                    addMessage('  Email: ' + data.email, 'received');
                    addMessage('  Status: ' + data.status, 'received');
                    addMessage('  Email Verified: ' + data.emailVerified, 'received');
                    addMessage('  Password Hash Length: ' + data.passwordHashLength, 'received');
                    addMessage('  Password Hash Prefix: ' + data.passwordHashPrefix, 'received');
                }
            })
            .catch(error => {
                addMessage('❌ User debug failed: ' + error.message, 'error');
            });
        }

        function testPassword() {

                addMessage('Vui lòng nhập username và password', 'error');

                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({

            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {

                addMessage('  Password Matches: ' + data.passwordMatches, 'received');

                }

        function tryDefaultPassword() {
            const username = document.getElementById('username').value;
            const defaultPassword = document.getElementById('defaultPassword').value;
            
            if (!username || !defaultPassword) {
                addMessage('Vui lòng nhập username và default password', 'error');
                return;
            }
            
            // Set password field to default
            document.getElementById('password').value = defaultPassword;
            
            addMessage('Trying default password: ' + defaultPassword, 'sent');
            
            // Test password first
            fetch('http://localhost:8080/api/debug/auth/test-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: username,
                    password: defaultPassword
                })
            })
            .then(response => response.json())
            .then(data => {
                addMessage('Default password test - Matches: ' + data.passwordMatches, 'received');
                
                if (data.passwordMatches) {
                    addMessage('✅ Default password works! Attempting login...', 'received');
                    login();
                } else {
                    addMessage('❌ Default password does not match', 'error');
                }
            })
            .catch(error => {
                addMessage('❌ Default password test failed: ' + error.message, 'error');
            });
        }

        function refreshJwtToken() {
            const currentToken = document.getElementById('jwtToken').value.trim();
            
            if (!currentToken) {
                addMessage('❌ No JWT token found - please login first', 'error');
                return;
            }
            
            addMessage('🔄 Refreshing JWT token...', 'sent');
            
            // Try to refresh using the current token
            fetch('http://localhost:8080/api/auth/refresh', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + currentToken
                },
                body: JSON.stringify({
                    token: currentToken
                })
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Refresh failed: ' + response.status);
                }
            })
            .then(data => {
                if (data.token || data.accessToken) {
                    const newToken = data.token || data.accessToken;
                    document.getElementById('jwtToken').value = newToken;
                    addMessage('✅ JWT token refreshed successfully', 'received');
                    
                    // Auto-reconnect if we were connected
                    if (connected || stompClient) {
                        addMessage('🔄 Reconnecting with new token...', 'sent');
                        disconnect();
                        setTimeout(() => {
                            connect();
                        }, 1000);
                    }
                } else {
                    addMessage('❌ No new token in refresh response', 'error');
                }
            })
            .catch(error => {
                addMessage('❌ Token refresh failed: ' + error.message, 'error');
                addMessage('💡 Try logging in again to get a new token', 'received');
            });
        }

        function onConnected(frame) {
            connected = true;
            setConnectionStatus('connected', 'Đã kết nối thành công');
            addMessage('✅ Kết nối WebSocket thành công!', 'received');
            addMessage('✅ STOMP Frame: ' + JSON.stringify(frame), 'received');
            console.log('Connected: ' + frame);
            
            // Extract userId from JWT token if available
            try {
                const jwtToken = document.getElementById('jwtToken').value.trim();
                if (jwtToken) {
                    const payload = JSON.parse(atob(jwtToken.split('.')[1]));
                    if (payload.userId) {
                        document.getElementById('userId').value = payload.userId;
                        currentUserId = payload.userId;
                        addMessage('✅ Extracted userId from JWT: ' + payload.userId, 'received');
                    }
                }
            } catch (error) {
                addMessage('⚠️ Could not extract userId from JWT token', 'received');
            }
            
            // Always enable buttons when connected - even if authentication partially failed
            // The backend will handle permission checks
            document.getElementById('subscribeBtn').disabled = false;
            document.getElementById('listBtn').disabled = false;
            document.getElementById('refreshBtn').disabled = false;
            document.getElementById('unsubscribeBtn').disabled = false;
            
            addMessage('✅ Portfolio Operations buttons enabled', 'received');

            // Subscribe to test topics first (safer subscriptions)
            try {
                stompClient.subscribe('/topic/echo', function (message) {
                    addMessage('Echo received: ' + message.body, 'received');
                });
                addMessage('✅ Subscribed to /topic/echo', 'received');
                
                stompClient.subscribe('/topic/ping', function (message) {
                    addMessage('Ping response: ' + message.body, 'received');
                });
                addMessage('✅ Subscribed to /topic/ping', 'received');
                
                stompClient.subscribe('/topic/hello', function (message) {
                    addMessage('Hello response: ' + message.body, 'received');
                });
                addMessage('✅ Subscribed to /topic/hello', 'received');
                
                stompClient.subscribe('/topic/connection', function (message) {
                    addMessage('Connection test response: ' + message.body, 'received');
                });
                addMessage('✅ Subscribed to /topic/connection', 'received');
                
                stompClient.subscribe('/topic/broadcast', function (message) {
                    addMessage('Broadcast received: ' + message.body, 'received');
                });
                addMessage('✅ Subscribed to /topic/broadcast', 'received');
                
            } catch (error) {
                addMessage('❌ Error subscribing to topics: ' + error.message, 'error');
                console.error('Subscription error:', error);
            }

            // Subscribe to user-specific queues later (after connection is stable)
            currentUserId = document.getElementById('userId').value;
            addMessage('ℹ️ Skipping user-specific subscriptions for now (will add when needed)', 'received');
            
            // Test basic functionality after subscriptions
            setTimeout(() => {
                if (connected) {
                    testBasicConnection();
                    testDebugEndpoints();
                    startHeartbeat();
                }
            }, 1000);
        }
        
        function testBasicConnection() {
            if (!connected) return;
            
            addMessage('Testing basic WebSocket functionality...', 'sent');
            
            // Test ping
            setTimeout(() => {
                if (connected) {
                    stompClient.send('/app/test/ping', {}, '');
                    addMessage('Sent ping test', 'sent');
                }
            }, 1000);
            
            // Test echo
            setTimeout(() => {
                if (connected) {
                    stompClient.send('/app/test/echo', {}, 'Hello from client');
                    addMessage('Sent echo test', 'sent');
                }
            }, 2000);
            
            // Test hello
            setTimeout(() => {
                if (connected) {
                    stompClient.send('/app/test/hello', {}, 'WebSocket Client');
                    addMessage('Sent hello test', 'sent');
                }
            }, 3000);
        }
        
        function testDebugEndpoints() {
            if (!connected) return;
            
            addMessage('Testing debug endpoints...', 'sent');
            
            // Subscribe to debug topics
            try {
                stompClient.subscribe('/topic/debug/pong', function (message) {
                    addMessage('Debug Pong: ' + message.body, 'received');
                });
                
                stompClient.subscribe('/user/queue/debug/echo', function (message) {
                    addMessage('Debug Echo: ' + message.body, 'received');
                });
                
                stompClient.subscribe('/topic/debug/test', function (message) {
                    addMessage('Debug Test: ' + message.body, 'received');
                });
                
                addMessage('✅ Subscribed to debug topics', 'received');
            } catch (error) {
                addMessage('❌ Error subscribing to debug topics: ' + error.message, 'error');
            }
            
            // Test debug endpoints
            setTimeout(() => {
                if (connected) {
                    stompClient.send('/app/debug/ping', {}, '');
                    addMessage('Sent debug ping', 'sent');
                }
            }, 500);
            
            setTimeout(() => {
                if (connected) {
                    stompClient.send('/app/debug/echo', {}, 'Debug echo test');
                    addMessage('Sent debug echo', 'sent');
                }
            }, 1000);
            
            setTimeout(() => {
                if (connected) {
                    stompClient.send('/app/debug/test', {}, '');
                    addMessage('Sent debug test', 'sent');
                }
            }, 1500);
        }

        function onError(error) {
            connected = false;
            stopHeartbeat();
            setConnectionStatus('disconnected', 'Lỗi kết nối: ' + error);
            addMessage('❌ Lỗi kết nối: ' + error, 'error');
            console.error('WebSocket Error:', error);
            
            // Add more detailed error information
            if (error && error.toString().includes('401')) {
                addMessage('❌ Authentication failed - please check JWT token', 'error');
            } else if (error && error.toString().includes('403')) {
                addMessage('❌ Authorization failed - insufficient permissions', 'error');
            } else if (error && error.toString().includes('timeout')) {
                addMessage('❌ Connection timeout - server may be down', 'error');
            }
            
            // Disable buttons
            document.getElementById('subscribeBtn').disabled = true;
            document.getElementById('listBtn').disabled = true;
            document.getElementById('refreshBtn').disabled = true;
            document.getElementById('unsubscribeBtn').disabled = true;
            
            // Suggest retry after a few seconds
            addMessage('💡 Tip: Try refreshing JWT token and reconnecting', 'received');
        }

        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            connected = false;
            stopHeartbeat();
            setConnectionStatus('disconnected', 'Đã ngắt kết nối');
            addMessage('Đã ngắt kết nối WebSocket', 'sent');
            
            // Disable buttons
            document.getElementById('subscribeBtn').disabled = true;
            document.getElementById('listBtn').disabled = true;
            document.getElementById('refreshBtn').disabled = true;
            document.getElementById('unsubscribeBtn').disabled = true;
        }

        function subscribePortfolio() {
            if (!connected) return;
            
            const userId = document.getElementById('userId').value;
            addMessage('Subscribing to portfolio for user: ' + userId, 'sent');
            
            // First subscribe to user queues if not already done
            try {
                // Subscribe to portfolio updates
                stompClient.subscribe('/user/queue/portfolio', function (message) {
                    addMessage('Portfolio Update nhận được', 'received');
                    const portfolioData = JSON.parse(message.body);
                    displayPortfolioData(portfolioData);
                });
                addMessage('✅ Subscribed to portfolio updates queue', 'received');

                // Subscribe to portfolio list
                stompClient.subscribe('/user/queue/portfolio-list', function (message) {
                    addMessage('Portfolio List nhận được', 'received');
                    const portfolioList = JSON.parse(message.body);
                    displayPortfolioList(portfolioList);
                });
                addMessage('✅ Subscribed to portfolio list queue', 'received');

                // Subscribe to errors
                stompClient.subscribe('/user/queue/errors', function (message) {
                    addMessage('Error nhận được: ' + message.body, 'error');
                    console.error('WebSocket Error:', message.body);
                });
                addMessage('✅ Subscribed to error queue', 'received');
                
            } catch (error) {
                addMessage('❌ Error subscribing to user queues: ' + error.message, 'error');
                console.error('User queue subscription error:', error);
            }
            
            // Then send subscription request
            stompClient.send('/app/portfolio/subscribe/' + userId, {}, '');
        }

        function getPortfolioList() {
            if (!connected) return;
            
            const userId = document.getElementById('userId').value;
            const includeBalances = document.getElementById('includeBalances').checked;
            const page = parseInt(document.getElementById('page').value);
            const size = parseInt(document.getElementById('size').value);
            
            const request = {
                userId: userId,
                includeBalances: includeBalances,
                page: page,
                size: size
            };
            
            addMessage('Getting portfolio list: ' + JSON.stringify(request), 'sent');
            stompClient.send('/app/portfolio/list', {}, JSON.stringify(request));
        }

        function refreshPortfolio() {
            if (!connected) return;
            
            const userId = document.getElementById('userId').value;
            const refreshCache = document.getElementById('refreshCache').checked;
            
            const request = {
                userId: userId,
                refreshCache: refreshCache
            };
            
            addMessage('Requesting portfolio update: ' + JSON.stringify(request), 'sent');
            stompClient.send('/app/portfolio/update', {}, JSON.stringify(request));
        }

        function unsubscribePortfolio() {
            if (!connected) return;
            
            const userId = document.getElementById('userId').value;
            addMessage('Unsubscribing from portfolio for user: ' + userId, 'sent');
            
            stompClient.send('/app/portfolio/unsubscribe/' + userId, {}, '');
        }

        function startHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
            }
            
            // Subscribe to keepalive response
            try {
                stompClient.subscribe('/topic/keepalive', function (message) {
                    const data = JSON.parse(message.body);
                    console.log('Heartbeat response:', data);
                    // Don't spam the UI with heartbeat messages
                });
            } catch (error) {
                console.error('Error subscribing to keepalive:', error);
            }
            
            // Send heartbeat every 30 seconds
            heartbeatInterval = setInterval(() => {
                if (connected && stompClient) {
                    try {
                        stompClient.send('/app/test/keepalive', {}, '');
                        console.log('Heartbeat sent');
                    } catch (error) {
                        console.error('Error sending heartbeat:', error);
                        addMessage('❌ Heartbeat failed: ' + error.message, 'error');
                    }
                }
            }, 30000);
            
            addMessage('✅ Heartbeat started (30s interval)', 'received');
        }

        function stopHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
                addMessage('🔴 Heartbeat stopped', 'received');
            }
        }

        function setConnectionStatus(status, message) {
            const statusElement = document.getElementById('connectionStatus');
            statusElement.className = 'status ' + status;
            statusElement.textContent = message;
        }

        function addMessage(message, type = 'received') {
            const messagesDiv = document.getElementById('messages');
            const messageElement = document.createElement('div');
            messageElement.className = 'message ' + type;
            messageElement.innerHTML = '<strong>' + new Date().toLocaleTimeString() + ':</strong> ' + message;
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
        }

        function displayPortfolioData(data) {
            const portfolioDiv = document.getElementById('portfolioData');
            portfolioDiv.innerHTML = '<h3>Portfolio Update</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }

        function displayPortfolioList(data) {
            const portfolioDiv = document.getElementById('portfolioData');
            
            let html = '<h3>Portfolio List</h3>';
            
            if (data.summary) {
                html += '<h4>Summary</h4>';
                html += '<p>Total Wallets: ' + data.summary.totalWallets + '</p>';
                html += '<p>Active Wallets: ' + data.summary.activeWallets + '</p>';
                html += '<p>Total Balance USD: $' + (data.summary.totalBalanceUsd || 0) + '</p>';
                html += '<p>Total Tokens: ' + data.summary.totalTokens + '</p>';
            }
            
            if (data.portfolios && data.portfolios.length > 0) {
                html += '<h4>Wallets</h4>';
                data.portfolios.forEach(wallet => {
                    html += '<div style="border: 1px solid #ddd; margin: 10px 0; padding: 10px; border-radius: 5px;">';
                    html += '<p><strong>Wallet:</strong> ' + wallet.walletName + ' (' + wallet.walletAddress + ')</p>';
                    html += '<p><strong>Type:</strong> ' + wallet.walletType + ' | <strong>Status:</strong> ' + wallet.status + '</p>';
                    html += '<p><strong>Total USD:</strong> $' + (wallet.totalBalanceUsd || 0) + ' | <strong>Tokens:</strong> ' + wallet.totalTokens + '</p>';
                    
                    if (wallet.balances && wallet.balances.length > 0) {
                        html += '<h5>Balances:</h5>';
                        wallet.balances.forEach(balance => {
                            html += '<div style="margin-left: 20px; padding: 5px; background-color: #f0f0f0; margin: 5px 0;">';
                            html += '<p><strong>' + balance.tokenSymbol + ':</strong> ' + balance.balance + ' ($' + (balance.usdValue || 0) + ')</p>';
                            html += '</div>';
                        });
                    }
                    
                    html += '</div>';
                });
            }
            
            if (data.pagination) {
                html += '<h4>Pagination</h4>';
                html += '<p>Page ' + (data.pagination.currentPage + 1) + ' of ' + data.pagination.totalPages + '</p>';
                html += '<p>Total Elements: ' + data.pagination.totalElements + '</p>';
            }
            
            portfolioDiv.innerHTML = html;
        }

        // Auto-fill user ID on page load
        window.onload = function() {
            const userIdInput = document.getElementById('userId');
            if (!userIdInput.value) {
                userIdInput.value = 'user123';
            }
        };
    </script>
</body>
</html>
