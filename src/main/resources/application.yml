spring:
  profiles:
    active: ${ENVIRONMENT:dev}
  aop:
    proxy-target-class: true
  
  # MySQL Database Configuration - Simplified single datasource
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/wallet_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autocommit=false}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:linh2002}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 60000
      pool-name: WalletHikariCP
      auto-commit: false
      
  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect  # Use the new non-deprecated dialect
        format_sql: true
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
        temp:
          use_jdbc_metadata_defaults: false
  
  # Flyway Database Migration Configuration
  flyway:
    enabled: false
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    encoding: UTF-8
    table: flyway_schema_history
    clean-disabled: true
    mixed: false
        
  # Redis Configuration - Temporarily disabled for debugging
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  data:
    redis:
      enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms
        shutdown-timeout: 100ms
    
  # Security Configuration
  security:
    require-ssl: false
    
  # Jackson Configuration
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-connections: 10000
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 20000
    keep-alive-timeout: 60000
    max-keep-alive-requests: 100

# EOS Blockchain Configuration
eos:
  api:
    # EOS Mainnet endpoints (production)
    urls: "${EOS_API_URL_1:https://eos.greymass.com},${EOS_API_URL_2:https://api.eossweden.org},${EOS_API_URL_3:https://mainnet.eos.dfuse.io},${EOS_API_URL_4:https://api.eosn.io}"
    url: ${EOS_API_URL:https://eos.greymass.com}
    
    # EOS Testnet endpoints (for testing with testnet accounts like yalinktrg222)
    testnet:
      urls: "${EOS_TESTNET_URL_1:https://jungle4.greymass.com},${EOS_TESTNET_URL_2:https://jungle4.cryptolions.io},${EOS_TESTNET_URL_3:https://jungle4.api.eosnation.io}"
      url: ${EOS_TESTNET_URL:https://jungle4.greymass.com}
    
    # Network selection: mainnet or testnet
    network: ${EOS_NETWORK:testnet}
    
    timeout: 30000
    connection-timeout: 10000
    read-timeout: 25000
    max-retries: 3
    retry-delay: 1000
    failover-enabled: true

# Hyperion API Configuration
hyperion:
  api:
    url: ${HYPERION_API_URL:https://eos.hyperion.eosrio.io}
    timeout: 15000
    max-retries: 3

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890abcdefghijklmnopqrstuvwxyz_secure_wallet_system_2024_minimum_64_bytes_for_HS512_algorithm}
  expiration: 86400 # 24 hours
  refresh-expiration: 604800 # 7 days

# Rate Limiting Configuration
rate-limit:
  requests-per-minute: 1000
  requests-per-hour: 60000
  enabled: true

# Caching Configuration
cache:
  portfolio:
    ttl: 300 # 5 minutes
  balance:
    ttl: 60 # 1 minute
  wallet:
    ttl: 3600 # 1 hour

# Logging Configuration
logging:
  level:
    com.wallet: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web.socket: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/wallet-system.log
    max-size: 100MB
    max-history: 30

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized


# Async Configuration
async:
  core-pool-size: 10
  max-pool-size: 50
  queue-capacity: 10000
  thread-name-prefix: WalletAsync-

# Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      eosApi:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        sliding-window-size: 10
        minimum-number-of-calls: 5
  retry:
    instances:
      eosApi:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
  timelimiter:
    instances:
      eosApi:
        timeout-duration: 30s
        cancel-running-future: true
      eosApiHealth:
        timeout-duration: 10s
        cancel-running-future: true

# Application-specific Configuration
app:
  repository:
    # Read/Write Repository Separation
    read-write-separation:
      enabled: ${READ_WRITE_SEPARATION_ENABLED:false}
      
  # Database Sharding Configuration
  sharding:
    enabled: ${SHARDING_ENABLED:false}
    shard-count: 16
    
  # Batch Processing Configuration
  batch:
    chunk-size: 1000
    thread-pool-size: 10
    
  # Performance Monitoring
  monitoring:
    slow-query-threshold: 1000 # milliseconds
    connection-pool-monitoring: true
    cache-monitoring: true

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/wallet_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autocommit=false
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:linh2002}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
      password: # No password for development
  flyway:
    enabled: false

logging:
  level:
    com.wallet: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.wallet: INFO
    org.hibernate.SQL: WARN

server:
  tomcat:
    max-connections: 20000
    threads:
      max: 400

