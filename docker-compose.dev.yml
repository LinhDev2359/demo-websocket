services:
  # MySQL Database for Development
  mysql:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-wallet-system}-mysql-dev
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_pass_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wallet_system}
      MYSQL_USER: ${MYSQL_USER:-wallet_dev_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_wallet_pass_2024}
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./mysql/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --log-bin-trust-function-creators=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-dev_root_pass_2024}"]
      timeout: 20s
      retries: 5
      interval: 10s
      start_period: 30s
    networks:
      - wallet-network

  # Redis Cache for Development
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-wallet-system}-redis-dev
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass_2024}
    volumes:
      - redis_dev_data:/data
      - ./redis/redis-dev.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-dev_redis_pass_2024}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_pass_2024}", "ping"]
      timeout: 5s
      retries: 3
      interval: 10s
    networks:
      - wallet-network

networks:
  wallet-network:
    driver: bridge

volumes:
  mysql_dev_data:
    driver: local
  redis_dev_data:
    driver: local